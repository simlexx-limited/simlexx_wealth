name: CI

on:
  pull_request:
    branches: [dev, production]

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      OPENROUTER_KEY: ci-placeholder
      LLM_MODEL: ci-placeholder
      LLM_ENABLED: "false"
      ADK_SUPPRESS_GEMINI_LITELLM_WARNINGS: "true"
      LLM_MAX_RETRIES: "1"
      LLM_RETRY_DELAY: "1"
      TAVILY_SEARCH_API: ci-placeholder
      R2_ACCOUNT_ID: ci-placeholder
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET_NAME: ci-placeholder
      BUCKET_URL: ci-placeholder
      PATH_TO_FIREBASE: ci-placeholder
      FIREBASE_WEB_API: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          if compgen -G "tests/test_*.py" > /dev/null || compgen -G "tests/*/test_*.py" > /dev/null; then
            pytest
          else
            echo "No tests found yet, skipping."
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f DOCKERFILE -t simlexx-wealth:ci .
